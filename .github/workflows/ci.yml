name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一 PR 的新推送取消上一轮未完成的 run：过期 run 的状态已无意义。main 的推送不
# 取消，保留每个提交的完整记录；本仓按批次推送，记录本身有参考价值。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI 只读仓库内容，不需要写权限。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 增量编译在 CI 上没有意义：缓存目录每次都是新的，只会多占空间。
  CARGO_INCREMENTAL: "0"

# job 拓扑：四个并行 job，不设 needs。
# fmt 不编译，秒级；lint 与 test 各用一套 target 与缓存；msrv 工具链不同，缓存天然
# 独立。四个 job 都调用 .w1mer/scripts/verify.sh 的对应阶段，本地与 CI 只有一份
# 命令清单，不再各自抄一遍。
jobs:
  fmt:
    name: 格式
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bash .w1mer/scripts/verify.sh fmt

  lint:
    name: 分层门、纯净门与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # shellcheck 在 runner 镜像里通常已预装；缺失时补装，避免脚本静态检查被跳过。
      - name: 确保 shellcheck 可用
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - run: bash .w1mer/scripts/verify.sh lint

  test:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: bash .w1mer/scripts/verify.sh test

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash .w1mer/scripts/verify.sh msrv

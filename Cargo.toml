[workspace]
resolver = "3"
members = [
    "crates/ita-kernel",
    "crates/ita-store",
    "crates/ita-proto",
    "crates/ita-sandbox",
    "crates/ita-exec",
    "crates/ita-tools",
    "crates/ita-model",
    "crates/ita-workflow",
    "crates/ita-server",
    "crates/ita-worker",
    "crates/ita-cli",
]

[workspace.package]
version = "0.1.25"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ITStudioOUC/ITAgent"

[workspace.dependencies]
# 存储层：SQLite 用 bundled 特性编译进去，避免依赖宿主机的 sqlite3 版本。
rusqlite = { version = "0.32", features = ["bundled"] }
# 时间与 id：ULID 需要时间戳，内核不碰时间，所以放在存储层。
ulid = "1"
